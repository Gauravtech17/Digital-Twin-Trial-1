services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polypulse
      POSTGRES_USER: polypulse
      POSTGRES_PASSWORD: polypulse
    ports: ["5432:5432"]
    volumes: ["polypulse_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polypulse -d polypulse"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  polypulse_pgdata:
